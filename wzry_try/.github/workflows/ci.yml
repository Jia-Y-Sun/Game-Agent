name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: 语法检查 + 文档检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 语法检查（不依赖 torch / 设备）
        run: |
          python -m py_compile $(git ls-files '*.py')

      - name: 文档链接与格式
        run: python tools/check_docs.py --verbose
